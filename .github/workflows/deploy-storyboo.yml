name: Deploy Storybook to Cloud Run

on:
  push:
    branches: [master]

permissions:
  contents: read
  id-token: write # Obrigatório para autenticação via OIDC / Workload Identity Federation

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Autentica no GCP sem credenciais JSON estáticas
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}

      # 2. Configura gcloud CLI
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 3. Configura autenticação do Docker com o Artifact Registry
      - name: Configure Docker Auth
        run: gcloud auth configure-docker us-east1-docker.pkg.dev

      # 4. Build e Push da imagem Docker do Storybook
      - name: Build and Push Docker Image
        run: |
          IMAGE="${{ secrets.GCP_IMAGE_BASE }}/storybook:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      # 5. Deploy no Cloud Run (com scale to 0 mantido)
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy plataforma-unooria-dev-storybook \
            --image="$IMAGE" \
            --region=us-east1 \
            --min-instances=0 \
            --no-cpu-throttling=false
