name: Publicar Pacote no NPM

# Roda SOMENTE quando uma versão é publicada:
#   npm version patch && git push --follow-tags
# Nada aqui toca o Cloud Run.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build & Publicar @unooria/design-system
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js 20 & Registro NPM
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: 📦 Instalar Dependências
        run: npm ci

      - name: 🔍 Verificação de Tipos TypeScript
        run: npx tsc --noEmit

      - name: 🏗️ Compilar Pacote NPM (@unooria/design-system)
        run: npm run build:package

      - name: 🚀 Publicar no NPM
        run: npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
