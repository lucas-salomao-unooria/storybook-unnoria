name: CI - Verificação Contínua

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, Storybook & Package Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar Dependências
        run: npm ci

      - name: 🔍 Verificação de Tipos TypeScript (Typecheck)
        run: npx tsc --noEmit

      - name: 📚 Compilar Storybook
        run: npm run build-storybook

      - name: 🏗️ Compilar Pacote NPM (@unooria/design-system)
        run: npm run build:package
